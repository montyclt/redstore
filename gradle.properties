org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft 26.3 is unobfuscated: there are no mappings to apply and Loom does not remap.
minecraft_version=26.3
loader_version=0.19.5
fabric_version=0.161.0+26.3

mod_version=0.1.0
maven_group=net.montyclt
archives_base_name=redstore

# Optional: an unpacked Faithful 64x resource pack. Set it and the build also derives Redstore's
# textures at 64x, as a resource pack the player can switch on in game. Nothing derived from it is
# ever committed or shipped; see spec/conventions.md section 10.3.
# faithful_pack=/home/you/.minecraft/resourcepacks/Faithful 64x - Release 15
